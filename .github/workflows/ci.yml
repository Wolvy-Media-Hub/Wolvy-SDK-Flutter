name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test and build the example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Wolvy Android SDK is not on Maven Central yet: build it into mavenLocal from a pinned commit.
      - uses: actions/checkout@v4
        with:
          repository: Wolvy-Media-Hub/Wolvy-SDK-Android
          ref: bb9e8f6ff81caa5b1f4ecdab474e00f3731e2d30
          path: android-core
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Android SDK 36
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Wolvy Android SDK into mavenLocal
        working-directory: android-core
        run: ./gradlew --no-daemon :wolvy-player:publishToMavenLocal
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test
      - name: Build the example
        working-directory: example
        run: flutter pub get && flutter analyze && flutter build apk --release
