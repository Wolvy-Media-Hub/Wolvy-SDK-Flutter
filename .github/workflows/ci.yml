name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test and build the example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Android SDK 36
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test
      - name: Build the example
        working-directory: example
        run: flutter pub get && flutter analyze && flutter build apk --release

  ios:
    name: iOS plugin and the example (simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: The Wolvy iOS SDK copy matches CORE_VERSION
        run: |
          commit=$(awk '{print $3}' ios/wolvy_player/CORE_VERSION)
          git clone --quiet https://github.com/Wolvy-Media-Hub/Wolvy-SDK-iOS /tmp/core
          git -C /tmp/core checkout --quiet "$commit"
          diff -r /tmp/core/Sources/WolvyPlayer ios/wolvy_player/Sources/wolvy_player/WolvyCore
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build the example for the simulator
        working-directory: example
        run: flutter pub get && flutter build ios --simulator --debug
