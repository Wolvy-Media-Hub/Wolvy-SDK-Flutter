name: wolvy_player
description: "Plays Wolvy's DRM-protected video in Flutter apps: Widevine, the viewer watermark, screen-capture protection and the web Player API's methods and events. Android now, iOS later."
version: 0.1.0
homepage: https://docs.wolvy.net/
repository: https://github.com/Wolvy-Media-Hub/Wolvy-SDK-Flutter
issue_tracker: https://github.com/Wolvy-Media-Hub/Wolvy-SDK-Flutter/issues
# Until the first release on pub.dev (publisher wolvy.net).
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: net.wolvy.player.flutter
        pluginClass: WolvyPlayerPlugin
